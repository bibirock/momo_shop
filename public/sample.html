<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MomoCard Sample</title>
    <style>
      :root { color: #241b20; background: #f6f3f4; font-family: Arial, "Noto Sans TC", sans-serif; }
      body { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { margin-bottom: 8px; }
      p { color: #6c5e65; line-height: 1.6; }
      pre { overflow-x: auto; border-radius: 12px; padding: 16px; background: #241b20; color: #fff; font-size: .85rem; line-height: 1.6; }
      #imperative-demo { width: min(100%, 380px); min-width: 0; margin-top: 20px; }
      .momo-card-error { border: 1px solid #e3b6c8; border-radius: 12px; padding: 20px; background: #fff4f7; color: #8b1747; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p>MOmoCard embed sample</p>
      <h1>從既有頁面載入商品卡</h1>
      <p>這段頁面展示公開 loader 與 imperative mount API 的實際嵌入結果。</p>
      <pre><code>const handle = MomoCard.mount("#imperative-demo", { cardId: "demo-food" });
// handle.destroy();</code></pre>
      <div id="imperative-demo" aria-label="商品卡嵌入目標"></div>
    </main>
    <script src="/momo-card.js"></script>
    <script>
      MomoCard.mount("#imperative-demo", { cardId: "demo-food" });
    </script>
  </body>
</html>
